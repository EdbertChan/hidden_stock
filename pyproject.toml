[project]
name = "hidden-stock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-postgres>=0.24",
    "dagster-celery>=0.24",
    "redis>=5.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "diskcache>=5.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hidden_stock*"]

[tool.setuptools.package-data]
hidden_stock = ["quirks/holdings/*.yaml"]
