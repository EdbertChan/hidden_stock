name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rule edits under .cursor/ need a code or test hunk
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            python3 scripts/check_skill_edit_has_code.py "$PR_BASE...$PR_HEAD"
          else
            python3 scripts/check_skill_edit_has_code.py HEAD~1..HEAD
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync

      - name: Unit + holdings CI regressions
        run: uv run pytest tests/ -q --tb=short
        env:
          # Network/API keys must not be required for CI unit tests.
          SEC_API_KEY: ""
          EODHD_API_KEY: ""
