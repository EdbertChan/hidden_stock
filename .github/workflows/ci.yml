name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync

      - name: Unit + holdings CI regressions
        run: uv run pytest tests/ -q --tb=short
        env:
          # Network/API keys must not be required for CI unit tests.
          SEC_API_KEY: ""
          EODHD_API_KEY: ""
